<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novameon</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0f0f14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .banner {
      width: 100%;
      display: block;
    }
    .content {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .card {
      text-align: center;
      max-width: 480px;
    }
    p {
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .contact {
      margin-top: 24px;
      font-size: 0.95rem;
    }
    a {
      color: #7c9cff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <img src="assets/banner.jpg" alt="Novameon Labs" class="banner" />
  <div class="content">
    <div class="card">
      <p>Nous concevons des applications mobiles et web centrées sur la mise en relation entre personnes.</p>
      <p>Notre premier produit, <a href="https://iameetyou.com">IAMeetYou</a>, est actuellement en bêta privée.</p>
      <p class="contact">Contact : <a href="mailto:contact@novameon.com">contact@novameon.com</a></p>
    </div>
  </div>
</body>
</html>
